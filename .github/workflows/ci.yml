# Public-tool adapter; no private reusable workflow or configuration is copied.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ci / build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build site and compare every generated page
        shell: bash
        run: |
          set -euo pipefail
          build_dir="$RUNNER_TEMP/spur-site"
          mkdir -p "$build_dir"
          OUT_DIR="$build_dir" npm run build:site
          for page in "$build_dir"/*.html; do
            cmp "$page" "$(basename "$page")"
          done
      - run: npm test

  security:
    name: ci / security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Scan working tree with Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --redact=100 --no-banner --exit-code 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Semgrep 1.187.0
        run: python -m pip install --disable-pip-version-check semgrep==1.187.0
      - name: Run Semgrep public CI rules, failing on ERROR findings
        shell: bash
        run: |
          set -euo pipefail
          status=0
          semgrep scan --config p/ci --severity ERROR --error --strict \
            --metrics=off --disable-version-check --json \
            --output "$RUNNER_TEMP/semgrep.json" . \
            >"$RUNNER_TEMP/semgrep.stdout" 2>"$RUNNER_TEMP/semgrep.stderr" || status=$?
          python tools/ci/semgrep-summary.py "$RUNNER_TEMP/semgrep.json"
          exit "$status"
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Audit locked dependencies
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
